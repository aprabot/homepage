<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Shopify connection · APRABot</title>
<link rel="stylesheet" href="../css/styles.css">
<style>#connection-result{max-width:520px;margin:15vh auto;padding:24px}#connection-result p{margin:12px 0}</style>

</head>
<body>
<main id="connection-result" hidden>
  <h1 id="connection-heading"></h1>
  <p>Return to the tab where you started onboarding.</p>
  <button type="button" class="dbtn" onclick="window.close()">Close this tab</button>
</main>
<a href="../dashboard/?tab=campaigns" id="ads-link">Open Ads</a>
<script>
  var target = new URL('../dashboard/', location.href);
  target.search = location.search;
  var callback = target.searchParams.has('connected') || target.searchParams.has('error');
  var onboardingId;
  try { onboardingId = sessionStorage.getItem('apra_onboarding_shopify'); } catch (error) {}
  if (callback && onboardingId) {
    sessionStorage.removeItem('apra_onboarding_shopify');
    var connected = target.searchParams.get('connected') === 'shopify';
    document.getElementById('connection-heading').textContent =
      connected ? 'Shopify connected' : 'Shopify connection did not complete';
    document.getElementById('connection-result').hidden = false;
    document.getElementById('ads-link').hidden = true;
    if (typeof BroadcastChannel === 'function') {
      var channel = new BroadcastChannel('apra-onboarding-shopify');
      channel.postMessage({ id: onboardingId, connected: connected });
      channel.close();
    }
  } else {
    target.searchParams.set('tab', callback ? 'integrations' : 'campaigns');
    location.replace(target);
  }
</script>
</body>
</html>
